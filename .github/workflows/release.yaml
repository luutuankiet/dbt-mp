name: Publish to pypi
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits and tags
      id-token: write # Needed for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build python-semantic-release
      - name: Create Release
        id: release
        uses: relekang/python-semantic-release@0f4c0b152e115c266c7a838c8e3997483a44de64 # v9.8.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: python -m build
      - name: Publish package to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
